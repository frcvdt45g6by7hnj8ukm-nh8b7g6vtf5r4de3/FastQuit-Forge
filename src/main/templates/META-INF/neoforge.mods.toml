modLoader = "javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mods]]
modId = "${mod_id}"
logoFile = "../../../../build/generated/sources/modMetadata/icon.png"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
authors = "${mod_authors}"
[[mixins]]
config="fastquit.mixins.json"
[[dependencies.${mod_id}]]
modId = "neoforge"
type="required"
versionRange="${neo_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId="cloth_config"
type="required"
versionRange="${cloth_config_version}"
ordering="NONE"
side="BOTH"
